protocol: http  # Use HTTP instead of HTTPS
esConfig:
  elasticsearch.yml: |
    xpack.security.enabled: true  # Keep security for auth
    xpack.security.http.ssl.enabled: false  # Disable TLS for HTTP API
http:
  tls:
    selfSignedCertificate:
      disabled: true  # Disable self-signed certs
resources:
  requests:
    cpu: "100m"
    memory: "512Mi"
  limits:
    cpu: "500m"
    memory: "1Gi"
antiAffinity: "soft"
