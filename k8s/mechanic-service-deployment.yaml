apiVersion: apps/v1
kind: Deployment
metadata:
  name: mechanic-service
  labels:
    app: mechanic-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mechanic-service
  template:
    metadata:
      labels:
        app: mechanic-service
    spec:
      containers:
      - name: mechanic-service
        image: mechanic-service:latest
        imagePullPolicy: Never  # for minikube local images
        ports:
        - containerPort: 8086
        env:
        - name: CONSUL_ADDRESS
          value: "consul:8500"
        - name: JAEGER_ENDPOINT
          value: "http://jaeger:4318/v1/traces"
        - name: SERVICE_PORT
          value: "8086"
        volumeMounts:
        - name: logs
          mountPath: /var/log/mechanic-service
      volumes:
      - name: logs
        emptyDir: {}
