apiVersion: batch/v1
kind: Job
metadata:
  name: mongodb-init
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: init
        image: mongo:7.0
        command:
        - /bin/sh
        - -c
        - |
          echo "Waiting for MongoDB to accept connections..."
          until mongosh --host mongodb:27017 --eval "db.runCommand({ping: 1})" > /dev/null 2>&1; do
            sleep 2
          done

          echo "Initializing replica set..."
          mongosh --host mongodb:27017 <<EOF
          rs.initiate({
            _id: "rs0",
            members: [{ _id: 0, host: "mongodb:27017" }]
          })
          EOF

          echo "Waiting for PRIMARY state..."
          until mongosh --host mongodb:27017 --eval "rs.status().myState === 1" > /dev/null 2>&1; do
            echo "Still waiting for PRIMARY..."
            sleep 3
          done

          echo "Seeding data..."
          mongosh --host mongodb:27017 repairdb <<EOF
          db.mechanics.drop()
          db.mechanics.insertMany([
            { _id: "mechanic1", name: "Berlin Auto Repair", location: { longitude: 13.388860, latitude: 52.517037 } },
            { _id: "mechanic2", name: "City Garage", location: { longitude: 13.397634, latitude: 52.529407 } },
            { _id: "mechanic3", name: "Fast Fix Mechanics", location: { longitude: 13.428555, latitude: 52.523219 } }
          ])
          db.mechanic_outbox.createIndex(
            { "kafka_topic": 1, "kafka_partition": 1, "kafka_offset": 1 },
            { unique: true }
          )
          EOF

          echo "MongoDB initialization complete!"
