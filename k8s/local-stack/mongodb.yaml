apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
      - name: mongodb
        image: mongo:7.0
        command:
        - "mongod"
        - "--bind_ip_all"
        - "--replSet"
        - "rs0"
        ports:
        - containerPort: 27017
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          value: root
        - name: MONGO_INITDB_ROOT_PASSWORD
          value: root
        volumeMounts:
        - name: data
          mountPath: /data/db
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - mongosh --quiet -u root -p root --authenticationDatabase admin --eval "db.adminCommand('ping')" || exit 1
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - mongosh --quiet -u root -p root --authenticationDatabase admin --eval "db.adminCommand('ping')" || exit 1
          initialDelaySeconds: 30
          periodSeconds: 20
        # This is the magic: auto-initiate if not done
        healthcheck:
          test:
            - CMD-SHELL
            - >
              mongosh --quiet -u root -p root --authenticationDatabase admin <<EOF
              try {
                if (rs.status().ok === 1) { quit(0); }
              } catch (e) {}
              rs.initiate({
                _id: "rs0",
                members: [{ _id: 0, host: "mongodb:27017" }]
              });
              EOF
          interval: 10s
          timeout: 10s
          start_period: 20s
          retries: 30
      volumes:
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
spec:
  selector:
    app: mongodb
  ports:
  - port: 27017
    targetPort: 27017
