apiVersion: batch/v1
kind: Job
metadata:
  name: mongodb-init
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: mongodb-init
        image: mongo:7.0
        command:
        - /bin/sh
        - -c
        - |
          echo "Waiting for MongoDB to be ready..."
          until mongosh --host mongodb --username root --password root --authenticationDatabase admin --eval "db.runCommand({ping: 1})" >/dev/null 2>&1; do
            sleep 2
          done

          echo "Initializing replica set..."
          mongosh --host mongodb --username root --password root --authenticationDatabase admin <<EOF
          rs.initiate({
            _id: "rs0",
            members: [{ _id: 0, host: "mongodb:27017" }]
          })
          EOF

          # Wait until it becomes PRIMARY
          until mongosh --host mongodb --username root --password root --authenticationDatabase admin --eval "rs.status().myState === 1" >/dev/null 2>&1; do
            echo "Waiting for PRIMARY..."
            sleep 3
          done

          echo "Seeding mechanics..."
          mongosh --host mongodb --username root --password root --authenticationDatabase admin repairdb <<EOF
          db.mechanics.drop()
          db.mechanics.insertMany([
            { _id: "mechanic1", name: "Berlin Auto Repair", location: { longitude: 13.388860, latitude: 52.517037 } },
            { _id: "mechanic2", name: "City Garage", location: { longitude: 13.397634, latitude: 52.529407 } },
            { _id: "mechanic3", name: "Fast Fix Mechanics", location: { longitude: 13.428555, latitude: 52.523219 } }
          ])
          EOF

          echo "Creating index on mechanic_outbox..."
          mongosh --host mongodb --username root --password root --authenticationDatabase admin repairdb <<EOF
          db.mechanic_outbox.createIndex(
            { "kafka_topic": 1, "kafka_partition": 1, "kafka_offset": 1 },
            { unique: true }
          )
          EOF
      initContainers:
      - name: wait-for-mongo
        image: busybox:1.36
        command: ['sh', '-c', "until nc -z mongodb 27017; do echo waiting for mongo; sleep 2; done;"]
