apiVersion: batch/v1
kind: Job
metadata:
  name: mongodb-init
spec:
  backoffLimit: 20  # retry a lot
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: init
        image: mongo:7.0
        command:
        - /bin/sh
        - -c
        - |
          echo "Waiting for MongoDB to be ready..."
          until mongosh --host mongodb:27017 -u root -p root --authenticationDatabase admin --eval "db.runCommand({ping: 1})" --quiet; do
            sleep 5
          done

          echo "Initializing replica set (idempotent)..."
          mongosh --host mongodb:27017 -u root -p root --authenticationDatabase admin --quiet <<EOF
          try {
            rs.status();
            print("Replica set already initialized");
          } catch (e) {
            rs.initiate({
              _id: "rs0",
              members: [{ _id: 0, host: "mongodb:27017" }]
            });
            print("Replica set initiated");
          }
          EOF

          echo "Waiting for PRIMARY..."
          until mongosh --host mongodb:27017 -u root -p root --authenticationDatabase admin --eval "rs.status().myState === 1" --quiet; do
            sleep 3
          done

          echo "Seeding mechanics data (idempotent)..."
          mongosh --host mongodb:27017 -u root -p root --authenticationDatabase admin repairdb --quiet <<EOF
          db.mechanics.drop();
          db.mechanics.insertMany([
            { _id: "mechanic1", name: "Berlin Auto Repair", location: { longitude: 13.388860, latitude: 52.517037 } },
            { _id: "mechanic2", name: "City Garage", location: { longitude: 13.397634, latitude: 52.529407 } },
            { _id: "mechanic3", name: "Fast Fix Mechanics", location: { longitude: 13.428555, latitude: 52.523219 } }
          ]);
          try {
            db.mechanic_outbox.createIndex(
              { "kafka_topic": 1, "kafka_partition": 1, "kafka_offset": 1 },
              { unique: true }
            );
            print("Index created");
          } catch (e) {
            if (e.codeName === "IndexOptionsConflict") {
              print("Index already exists");
            } else {
              throw e;
            }
          }
          EOF

          echo "MongoDB setup complete!"
